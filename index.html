<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#111222;font-family:Arial,sans-serif;padding:15px}
.game{width:100%;max-width:360px;padding:22px 15px;background:#3d3d50;border-radius:25px;text-align:center}
h1{color:white;margin:0 0 12px;font-size:34px}
.turn{color:white;font-size:20px;font-weight:bold;margin-bottom:15px}
#player{color:#00eaff}
.board{width:100%;max-width:330px;aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{width:100%;aspect-ratio:1;border:0;border-radius:15px;background:#666675;color:white;font-size:55px;font-weight:bold;cursor:pointer;touch-action:manipulation}
.cell.x{color:#00eaff;text-shadow:0 0 15px #00eaff}
.cell.o{color:#ff35d4;text-shadow:0 0 15px #ff35d4}
.cell.win{background:#00c878;color:white}
#hasil{height:30px;margin-top:12px;color:white;font-size:20px;font-weight:bold}
#reset{border:0;border-radius:15px;padding:13px 30px;margin-top:8px;background:white;color:#222;font-size:17px;font-weight:bold;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<div class="game">
<h1>🎮 Tic Tac Toe</h1>
<div class="turn">Giliran: <span id="player">X</span></div>
<div class="board">
<div class="cell" id="c0" onclick="play(0)"></div><div class="cell" id="c1" onclick="play(1)"></div><div class="cell" id="c2" onclick="play(2)"></div>
<div class="cell" id="c3" onclick="play(3)"></div><div class="cell" id="c4" onclick="play(4)"></div><div class="cell" id="c5" onclick="play(5)"></div>
<div class="cell" id="c6" onclick="play(6)"></div><div class="cell" id="c7" onclick="play(7)"></div><div class="cell" id="c8" onclick="play(8)"></div>
</div>
<div id="hasil"></div>
<button id="reset" onclick="resetGame()">🔄 Main Lagi</button>
</div>
<script>
let papan=["","","","","","","","",""],giliran="X",selesai=false;
let polaMenang=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function play(i){
 if(selesai||papan[i]!="")return;
 papan[i]=giliran;
 let kotak=document.getElementById("c"+i);
 kotak.innerText=giliran;
 kotak.classList.add(giliran=="X"?"x":"o");
 cek();
 if(!selesai){giliran=giliran=="X"?"O":"X";updateGiliran()}
}
function updateGiliran(){
 let p=document.getElementById("player");
 p.innerText=giliran;p.style.color=giliran=="X"?"#00eaff":"#ff35d4";
}
function cek(){
 for(let p of polaMenang){
  let[a,b,c]=p;
  if(papan[a]!=""&&papan[a]==papan[b]&&papan[a]==papan[c]){
   selesai=true;
   [a,b,c].forEach(i=>document.getElementById("c"+i).classList.add("win"));
   document.getElementById("hasil").innerText="🏆 "+giliran+" MENANG!";
   return;
  }
 }
 if(!papan.includes("")){selesai=true;document.getElementById("hasil").innerText="🤝 SERI!"}
}
function resetGame(){
 papan=["","","","","","","","",""];giliran="X";selesai=false;
 for(let i=0;i<9;i++){let k=document.getElementById("c"+i);k.innerText="";k.className="cell"}
 document.getElementById("player").innerText="X";document.getElementById("player").style.color="#00eaff";
 document.getElementById("hasil").innerText="";
}
</script>
</body>
</html>
